<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сотрудник — Сегодня</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&amp;family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
h1,h2,h3{font-family:Geologica,sans-serif;letter-spacing:-0.01em}
a{color:#9DB6CB}a:hover{color:#C3D4E2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E2125; font-family: Golos Text, system-ui, sans-serif; color: #ECEEF0; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 26px 16px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="flex: 1">
        <div style="font-size: 14px; color: #A0A8B1">Среда, 4 ноября</div>
        <h1 style="margin: 2px 0 0; font-size: 30px; font-weight: 700">Сегодня</h1>
      </div>
      <div aria-label="Профиль" style="width: 46px; height: 46px; border-radius: 50%; background: #4A5A68; display: flex; align-items: center; justify-content: center; font-weight: 700">МС</div>
    </div>

    <div style="background: #272B30; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div>
          <div style="font-size: 13px; color: #A0A8B1">Смена идёт</div>
          <div style="font-size: 26px; font-weight: 700">3:12:40</div>
        </div>
        <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: #2E3A33; color: #A9C9B4">у объекта</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 54px; border-radius: 14px; border: 1px solid #3B4148; background: transparent; color: #ECEEF0; font: 600 16px Golos Text, sans-serif">Пауза</button>
        <button type="button" style="height: 54px; border-radius: 14px; border: none; background: #4A2E2D; color: #F0B2AC; font: 600 16px Golos Text, sans-serif">Закончить смену</button>
      </div>
    </div>

    <div style="background: #272B30; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #A0A8B1">Сделано сегодня</span><span style="font-weight: 700">2 из 4</span></div>
      <div style="height: 10px; border-radius: 999px; background: #3B4148"><div style="width: 50%; height: 10px; border-radius: 999px; background: #7E9BB3"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 15px"><span style="color: #A0A8B1">Заработок за неделю</span><span style="font-weight: 700">186 €</span></div>
    </div>

    <sc-for list="{{tasks}}" as="t" hint-placeholder-count="2">
      <div style="background: #30353B; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
          <div style="font-size: 18px; font-weight: 600">{{t.title}}</div>
          <sc-if value="{{t.urgent}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; color: #F0B2AC; background: #4A2E2D; padding: 4px 8px; border-radius: 8px; flex-shrink: 0">Срочно</span></sc-if>
        </div>
        <div style="font-size: 14px; color: #A0A8B1">{{t.meta}}</div>
        <button type="button" style="{{t.btn}}">{{t.action}}</button>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Нижнее меню" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #272B30; border-top: 1px solid #30353B; padding: 8px 6px 22px">
    <sc-for list="{{tabs}}" as="b" hint-placeholder-count="4">
      <a href="#" style="{{b.style}}">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
        <span>{{b.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#56728A","options":["#56728A","#5E6B5E","#5A5F66"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#56728A';
    const btn = (primary) => 'height:56px;border-radius:14px;font:600 17px Golos Text,sans-serif;' + (primary ? 'border:none;background:' + accent + ';color:#FFFFFF' : 'border:1px solid #3B4148;background:transparent;color:#ECEEF0');
    const tasks = [
      { title: 'Замена смесителя', meta: 'кв. 12 · до 14:00 · чек-лист 1/3', urgent: true, action: 'Закончил', btn: btn(true) },
      { title: 'Уборка офиса', meta: 'Kanzlei Weber · 15:00', urgent: false, action: 'Начал', btn: btn(false) }
    ];
    const tab = (on) => 'display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;font-size:12px;text-decoration:none;font-weight:' + (on ? '600;color:#C3D4E2' : '500;color:#A0A8B1');
    const tabs = [
      { label: 'Сегодня', icon: 'M4 12l5 5L20 6', style: tab(true) },
      { label: 'Задачи', icon: 'M4 6h16M4 12h16M4 18h10', style: tab(false) },
      { label: 'Заработок', icon: 'M12 3v18M17 7H9.5a3 3 0 000 6h5a3 3 0 010 6H6', style: tab(false) },
      { label: 'Профиль', icon: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0', style: tab(false) }
    ];
    return { accent, tasks, tabs };
  }
}
</script>
</body>
</html>
